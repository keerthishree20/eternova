services:
  - type: web
    name: eternova-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /app/eternova.db
      - key: CORS_ORIGINS
        value: https://eternova-peach.vercel.app
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Render's free tier blocks SMTP, so production email goes through
      # Brevo's HTTPS API when this key is set. BREVO_SENDER must be a
      # sender address verified in the Brevo dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: eternova-data
      mountPath: /app
      sizeGB: 1
